---
- name: Deploy MCA application on EKS
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: "eu-west-3"
    eks_cluster_name: "mca-devops-cluster"
    namespace: "mca"

    frontend_image: "mkeita/mca-devops-frontend"
    backend_image: "mkeita/mca-devops-backend"

    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('1.0.0', true) }}"

    k8s_manifests_dir: "../k8s"

  tasks:

    # ==========================================
    # 1. Configure kubeconfig
    # ==========================================

    - name: Configure kubeconfig for EKS
      ansible.builtin.command:
        cmd:
          aws eks update-kubeconfig
          --region {{ aws_region }}
          --name {{ eks_cluster_name }}
      changed_when: false


    # ==========================================
    # 2. Verify EKS connection
    # ==========================================

    - name: Check Kubernetes cluster
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
      register: nodes

    - name: Display Kubernetes nodes
      ansible.builtin.debug:
        msg: "EKS nodes: {{ nodes.resources | map(attribute='metadata.name') | list }}"


    # ==========================================
    # 3. Create namespace
    # ==========================================

    - name: Create application namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ namespace }}"
        state: present


    # ==========================================
    # 4. Deploy PostgreSQL PVC
    # ==========================================

    - name: Deploy PostgreSQL PVC
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        src: "{{ k8s_manifests_dir }}/postgres-pvc.yaml"


    # ==========================================
    # 5. Deploy PostgreSQL
    # ==========================================

    - name: Deploy Secret
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        src: "{{ k8s_manifests_dir }}/secret.yaml"


    - name: Deploy PostgreSQL
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        src: "{{ k8s_manifests_dir }}/postgres-deployment.yaml"


    - name: Deploy PostgreSQL service
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        src: "{{ k8s_manifests_dir }}/postgres-service.yaml"


    # ==========================================
    # 6. Deploy backend
    # ==========================================

    - name: Deploy backend
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        src: "{{ k8s_manifests_dir }}/backend-deployment.yaml"


    - name: Deploy backend service
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        src: "{{ k8s_manifests_dir }}/backend-service.yaml"


    # ==========================================
    # 7. Update backend image
    # ==========================================

    - name: Update backend image
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: backend
          spec:
            template:
              spec:
                containers:
                  - name: backend
                    image: "{{ backend_image }}:{{ image_tag }}"


    # ==========================================
    # 8. Deploy frontend
    # ==========================================

    - name: Deploy frontend
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        src: "{{ k8s_manifests_dir }}/frontend-deployment.yaml"


    - name: Deploy frontend service
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        src: "{{ k8s_manifests_dir }}/frontend-service.yaml"


    # ==========================================
    # 9. Update frontend image
    # ==========================================

    - name: Update frontend image
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: frontend
          spec:
            template:
              spec:
                containers:
                  - name: frontend
                    image: "{{ frontend_image }}:{{ image_tag }}"


    # ==========================================
    # 10. Deploy Ingress
    # ==========================================

    - name: Deploy Ingress
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        src: "{{ k8s_manifests_dir }}/ingress.yaml"

    # ==========================================
    # 11. Wait for deployments
    # ==========================================

    - name: Wait for backend rollout
      ansible.builtin.command:
        cmd:
          kubectl rollout status
          deployment/backend
          -n {{ namespace }}
          --timeout=180s
      changed_when: false


    - name: Wait for frontend rollout
      ansible.builtin.command:
        cmd:
          kubectl rollout status
          deployment/frontend
          -n {{ namespace }}
          --timeout=180s
      changed_when: false


    # ==========================================
    # 12. Display final status
    # ==========================================

    - name: Get application pods
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ namespace }}"
      register: pods


    - name: Display application pods
      ansible.builtin.debug:
        msg: "{{ pods.resources | map(attribute='metadata.name') | list }}"


    - name: Get services
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        namespace: "{{ namespace }}"
      register: services


    - name: Display services
      ansible.builtin.debug:
        msg: "{{ services.resources | map(attribute='metadata.name') | list }}"


    - name: Get ingress
      kubernetes.core.k8s_info:
        api_version: networking.k8s.io/v1
        kind: Ingress
        namespace: "{{ namespace }}"
      register: ingress


    - name: Display ALB hostname
      ansible.builtin.debug:
        msg: "{{ ingress.resources[0].status.loadBalancer.ingress | default([]) }}"

