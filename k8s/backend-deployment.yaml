apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: mkeita/mca-devops-backend:1.0.0

          ports:
            - containerPort: 8080

          env:
            - name: SPRING_POSTGRES_URL
              value: "jdbc:postgresql://postgres:5432/postgres"

            - name: SPRING_POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: user

            - name: SPRING_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
